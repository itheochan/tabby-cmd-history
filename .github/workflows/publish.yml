name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # 版本号以 release 的 git tag 为准（支持 v1.2.3 或 1.2.3），
      # 自动同步到 package.json，避免 tag 与版本不一致。
      - name: Sync version from release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version
          echo "Will publish version: $VERSION"

      # package.json 的 prepublishOnly 会自动执行
      # npm run verify（lint + typecheck + test + build + pack:check），
      # 任一失败则发布中止。
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
